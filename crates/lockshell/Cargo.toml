[package]
name = "lockshell"
version = "0.2.0-alpha.1"
edition = "2021"
authors = ["Arya Teja Rudraraju <aryayt55@gmail.com>"]
license = "Apache-2.0"
description = "AI-safe secret broker. Cloud LLMs decide; the local broker resolves and executes. Secrets never leave the machine."
homepage = "https://github.com/aryateja2106/lockshell"
repository = "https://github.com/aryateja2106/lockshell"
documentation = "https://github.com/aryateja2106/lockshell#readme"
readme = "README.md"
keywords = ["secrets", "agents", "ai", "cli", "security"]
categories = ["command-line-utilities", "authentication"]
rust-version = "1.74"

[[bin]]
name = "lockshell"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "color", "wrap_help"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
which = "6.0"
nu-ansi-term = "0.50"
# zero out secret values in process memory once they're no longer needed.
# best-effort against forensic memory dumps; not a defense against active root.
zeroize = { version = "1.8", features = ["derive"] }
# Phase 2 SSH module (Touch ID-gated keyless SSH).
lockshell-ssh = { path = "../lockshell-ssh" }
base64 = "0.22"
dirs = "5.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
