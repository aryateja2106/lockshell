[package]
name = "lockshell-ssh"
version = "0.1.0"
edition = "2021"
authors = ["Arya Teja Rudraraju <aryayt55@gmail.com>"]
license = "Apache-2.0"
description = "SSH primitives for lockshell: signer trait, wire format, CA (forthcoming)."
repository = "https://github.com/aryateja2106/lockshell"
rust-version = "1.74"

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
zeroize = { version = "1.8", features = ["derive"] }
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2.11"
security-framework-sys = "2.11"
core-foundation = "0.9"
core-foundation-sys = "0.8"

[dev-dependencies]
tempfile = "3"
ring = "0.17"
