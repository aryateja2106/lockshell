[package]
name = "lockshelld"
version = "0.1.0"
edition = "2021"
authors = ["Arya Teja Rudraraju <aryayt55@gmail.com>"]
license = "Apache-2.0"
description = "Lockshell daemon: long-running broker hosting the SSH agent and JSON-RPC control socket."
rust-version = "1.74"

[[bin]]
name = "lockshelld"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
lockshell-proto = { path = "../lockshell-proto" }

[dev-dependencies]
tempfile = "3.10"
